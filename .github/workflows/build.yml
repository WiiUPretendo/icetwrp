name: Build TWRP for Xiaomi ice (Redmi A1)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP Boot Image
    runs-on: ubuntu-20.04

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip openjdk-11-jdk bc ccache rsync

          sudo ln -sf /usr/bin/python3 /usr/bin/python
          git config --global user.name "Builder"
          git config --global user.email "builder@github.com"

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Initialize Minimal TWRP Manifest
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1

      - name: Repo Sync
        run: |
          cd ~/twrp
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree
        run: |
          cd ~/twrp
          git clone --depth=1 https://github.com/WiiUPretendo/icetwrp.git device/xiaomi/ice

      - name: Build TWRP (boot.img)
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_ice-eng
          mka bootimage -j$(nproc --all)

      - name: Check Output
        run: |
          cd ~/twrp
          ls -la out/target/product/ice/
          cp out/target/product/ice/boot.img ~/twrp-ice-boot.img

      - name: Upload TWRP Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-ice-boot
          path: ~/twrp-ice-boot.img
